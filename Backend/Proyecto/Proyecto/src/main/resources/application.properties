spring.application.name=Proyecto

spring.datasource.url=jdbc:postgresql://localhost:5432/geopolitica
spring.datasource.username=${DB_USERNAME:geopolitica}
spring.datasource.password=${DB_PASSWORD:geopolitica}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Único lugar que conoce la base URL y el cubo de la OEC (el frontend ya no
# llama a la OEC directo, solo a este backend). `anio` es el año por defecto
# cuando el frontend no lo especifica; debe coincidir con VITE_OEC_YEAR
# (Frontend/.env) para que ambos arranquen mostrando el mismo año.
oec.base-url=https://api-v2.oec.world/tesseract
oec.cube=trade_i_baci_a_22
oec.anio=2023

app.cors.allowed-origin-patterns=http://localhost:*
